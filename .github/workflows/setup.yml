name: Repo Setup

on:
  push:
    branches:
      - main

# Run once when a new repo is created from this template, then self-delete.
jobs:
  setup:
    name: Initialize from template
    runs-on: ubuntu-latest
    # Skip when running inside the template repo itself.
    if: github.repository != 'jasonkolodziej/git-repo-template'

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Makes the workflow idempotent if the self-delete below is refused.
      - name: Check whether already initialized
        id: state
        run: |
          if grep -q "^# git-repo-template$" README.md; then
            echo "initialized=false" >> "$GITHUB_OUTPUT"
          else
            echo "initialized=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Strip template-only sections
        if: steps.state.outputs.initialized == 'false'
        run: |
          # Removes everything between <!-- TEMPLATE-ONLY:START --> and <!-- TEMPLATE-ONLY:END -->
          # (inclusive), e.g. docs that describe this template rather than the new repo.
          find . -type f -name "*.md" -not -path "./.git/*" -print0 \
            | xargs -0 sed -i '/^<!-- TEMPLATE-ONLY:START -->$/,/^<!-- TEMPLATE-ONLY:END -->$/d'

      - name: Replace template placeholders
        if: steps.state.outputs.initialized == 'false'
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          REPO_FULL: ${{ github.repository }}
          REPO_DESCRIPTION: ${{ github.event.repository.description }}
        run: |
          # Replace README headline with the new repo name.
          sed -i "s/^# git-repo-template$/# ${REPO_NAME}/" README.md

          # Replace the description placeholder (python avoids sed escaping issues).
          python3 - <<'PY'
          import os, pathlib
          p = pathlib.Path("README.md")
          desc = os.environ.get("REPO_DESCRIPTION") or "<!-- TODO: one-line description -->"
          p.write_text(p.read_text().replace("<!-- REPO_DESCRIPTION -->", desc))
          PY

          # Replace any inline references to the template repo name.
          grep -rl "git-repo-template" . \
            --include="*.md" \
            --include="*.txt" \
            --exclude-dir=".git" \
            | xargs -r -I{} sed -i "s/git-repo-template/${REPO_NAME}/g" {}

      - name: Commit and push changes
        if: steps.state.outputs.initialized == 'false'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          # Only commit if there are actual changes.
          git diff --cached --quiet || git commit -m "chore: initialize repository from template"
          git push

      # Pushed separately: GITHUB_TOKEN may be refused for changes under .github/workflows/.
      # If it is, the placeholders above are already pushed and the check step makes
      # later runs no-ops; delete this file by hand.
      - name: Remove this setup workflow
        if: steps.state.outputs.initialized == 'false'
        continue-on-error: true
        run: |
          git rm .github/workflows/setup.yml
          git commit -m "chore: remove one-time setup workflow"
          git push

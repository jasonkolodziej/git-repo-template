# Prepares the environment for the Copilot cloud agent before it starts work.
# The job MUST be named `copilot-setup-steps`. Keep installs in sync with ci.yml.
# hashFiles() works here because it is used in step-level `if`s, after checkout.
name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/copilot-setup-steps.yml]
  pull_request:
    paths: [.github/workflows/copilot-setup-steps.yml]

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        if: ${{ hashFiles('pyproject.toml') != '' }}
        uses: astral-sh/setup-uv@v6
      - name: Install Python dependencies
        if: ${{ hashFiles('pyproject.toml') != '' }}
        run: uv sync

      - name: Set up pnpm
        if: ${{ hashFiles('package.json') != '' }}
        uses: pnpm/action-setup@v4
      - name: Set up Node
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install Node dependencies
        if: ${{ hashFiles('package.json') != '' }}
        run: pnpm install --frozen-lockfile
